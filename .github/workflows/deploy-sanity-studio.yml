name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - "sanity/**"
      - "sanity.config.ts"
      - "sanity.cli.ts"
      - "package.json"
      - ".github/workflows/deploy-sanity-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-studio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Deploy Sanity Studio
        run: npx sanity deploy --url fused-projectbeheer --yes --schema-required
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
